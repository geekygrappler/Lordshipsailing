<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f4ed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171714" media="(prefers-color-scheme: dark)">

    {% assign meta_title = page.title | default: site.title %}
    {% assign meta_description = page.description | default: site.description | strip_html | normalize_whitespace %}
    <title>{{ meta_title }}</title>
    <meta name="description" content="{{ meta_description | escape }}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ meta_title | escape }}">
    <meta property="og:description" content="{{ meta_description | escape }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ meta_title | escape }}">
    <meta name="twitter:description" content="{{ meta_description | escape }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <main class="article" id="main-content">
      {{ content }}
    </main>
  </body>
</html>
